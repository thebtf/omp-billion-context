<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Billion Context</title>
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}

		:root {
			color-scheme: light dark;
			--plane: #f5f7f8;
			--plane-2: #e9edef;
			--plane-3: #dfe4e7;
			--ink: #14181b;
			--ink-2: #49525a;
			--ink-3: #667079;
			--rule: #d7dde1;
			--rule-strong: #b4bec6;
			--accent: #1d5f8a;
			--accent-2: #174c6e;
			--accent-soft: #d3e5ef;
			--on-accent: #ffffff;
			--ok: #1c6a4c;
			--bad: #a2272b;
			--ring: #1d5f8a;
			--shadow: 0 10px 28px rgba(16, 24, 30, .16);
			--sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			--mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--plane: #13171a;
				--plane-2: #1b2125;
				--plane-3: #232b30;
				--ink: #e7ecef;
				--ink-2: #b0bac2;
				--ink-3: #8b959e;
				--rule: #2a3339;
				--rule-strong: #3b474f;
				--accent: #3d8fbf;
				--accent-2: #57a3cf;
				--accent-soft: #17303d;
				--ok: #6cc59c;
				--bad: #e8908c;
				--ring: #9ccbe8;
				--shadow: 0 10px 28px rgba(0, 0, 0, .5);
			}
		}

		html {
			-webkit-text-size-adjust: 100%;
			scrollbar-color: var(--rule-strong) var(--plane);
		}

		body {
			margin: 0;
			background: var(--plane);
			color: var(--ink);
			font: 400 .9375rem/1.55 var(--sans);
			font-variant-numeric: tabular-nums;
			-webkit-font-smoothing: antialiased;
		}

		::selection {
			background: var(--accent-soft);
			color: var(--ink);
		}

		:focus-visible {
			outline: 2px solid var(--ring);
			outline-offset: 2px;
		}

		input {
			caret-color: var(--accent);
		}

		[hidden] {
			display: none !important;
		}

		.app {
			max-width: 78rem;
			margin: 0 auto;
			padding: 1.5rem clamp(1rem, 3vw, 2.5rem) 3.5rem;
		}

		/* On a wide screen CPA's floating panel sits in the top-right corner, up to
		   300px wide. Reserve a right-hand lane for it instead of 125px of empty
		   height on every row; on narrow screens the panel spans the top instead. */
		@media (min-width: 60rem) {
			.app {
				max-width: 100rem;
				padding-inline-end: 21rem;
			}
		}

		@media (max-width: 59.999rem) {
			.app {
				padding-top: 8.6rem;
			}
		}

		.fallback {
			max-width: 34rem;
			margin: 0 auto;
			padding: 9rem 1rem;
			color: var(--ink-2);
		}

		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			margin: -1px;
			padding: 0;
			overflow: hidden;
			clip-path: inset(50%);
			white-space: nowrap;
		}

		.masthead {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: .75rem;
			padding-bottom: .7rem;
			border-bottom: 2px solid var(--ink);
		}

		.brand {
			min-width: 0;
		}

		.brand h1 {
			margin: 0;
			font-size: 1.5rem;
			font-weight: 640;
			letter-spacing: -.022em;
			line-height: 1.2;
		}

		.tagline {
			display: block;
			margin-top: .2rem;
			color: var(--ink-2);
			font-size: .875rem;
		}

		.controls {
			display: flex;
			align-items: center;
			gap: .5rem;
			flex-wrap: wrap;
		}

		.lang {
			display: inline-flex;
			border: 1px solid var(--rule-strong);
			border-radius: 2px;
			overflow: hidden;
			background: var(--plane);
		}

		.lang button {
			min-width: 2.75rem;
			min-height: 2.25rem;
			padding: 0 .55rem;
			border: 0;
			border-inline-start: 1px solid var(--rule);
			background: transparent;
			color: var(--ink-2);
			font: 550 .8125rem/1 var(--sans);
			letter-spacing: .04em;
			cursor: pointer;
			transition: background-color .15s ease, color .15s ease;
		}

		.lang button:first-child {
			border-inline-start: 0;
		}

		.lang button:hover {
			background: var(--plane-2);
			color: var(--ink);
		}

		.lang button[aria-pressed="true"] {
			background: var(--accent);
			color: var(--on-accent);
		}

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			min-height: 2.25rem;
			padding: .45rem .85rem;
			border: 1px solid var(--rule-strong);
			border-radius: 2px;
			background: var(--plane);
			color: var(--ink);
			font: 550 .875rem/1.3 var(--sans);
			text-decoration: none;
			cursor: pointer;
			transition: background-color .15s ease, border-color .15s ease, color .15s ease;
		}

		.btn:hover {
			background: var(--plane-2);
			border-color: var(--ink-3);
		}

		.btn:active {
			background: var(--plane-3);
		}

		.btn[disabled],
		.btn[aria-disabled="true"] {
			opacity: .5;
			cursor: not-allowed;
			pointer-events: none;
		}

		.btn.primary {
			background: var(--accent);
			border-color: var(--accent);
			color: var(--on-accent);
		}

		.btn.primary:hover {
			background: var(--accent-2);
			border-color: var(--accent-2);
		}

		.btn.small {
			min-height: 2rem;
			padding: .25rem .6rem;
			font-size: .8125rem;
		}

		.tipwrap {
			position: relative;
			display: inline-flex;
		}

		.tip {
			position: absolute;
			top: calc(100% + .5rem);
			right: 0;
			z-index: 5;
			width: max-content;
			max-width: min(23rem, calc(100vw - 2rem));
			padding: .6rem .7rem;
			border: 1px solid var(--rule-strong);
			background: var(--plane);
			color: var(--ink);
			box-shadow: var(--shadow);
			font-size: .8125rem;
			line-height: 1.45;
			opacity: 0;
			visibility: hidden;
			transform: translateY(-2px);
			transition: opacity .15s ease, transform .15s ease, visibility .15s;
		}

		.tipwrap:hover .tip,
		.tipwrap:focus-within .tip {
			opacity: 1;
			visibility: visible;
			transform: none;
		}

		.notice {
			display: flex;
			align-items: flex-start;
			gap: .75rem 1.25rem;
			flex-wrap: wrap;
			margin-top: 1.25rem;
			padding: .7rem .85rem;
			border: 1px solid var(--rule-strong);
			background: var(--plane-2);
		}

		.notice p {
			flex: 1 1 20rem;
			margin: 0;
			color: var(--ink-2);
			font-size: .875rem;
		}

		main {
			padding-top: 1.5rem;
		}

		.totals {
			margin: 0;
			border-top: 1px solid var(--ink);
		}

		.totals div {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			align-items: baseline;
			gap: .35rem 1.5rem;
			padding: .6rem 0;
			border-bottom: 1px solid var(--rule);
		}

		.totals dt {
			color: var(--ink-2);
		}

		.totals dd {
			margin: 0;
			font-size: 1.0625rem;
			font-weight: 600;
			white-space: nowrap;
		}

		.totals div.lead dt {
			color: var(--ink);
			font-weight: 560;
		}

		.totals div.lead dd {
			font-size: 1.875rem;
			font-weight: 620;
			letter-spacing: -.025em;
			line-height: 1.15;
		}

		.totals-note {
			max-width: 68ch;
			margin: .65rem 0 0;
			color: var(--ink-2);
			font-size: .8125rem;
		}

		.section {
			margin-top: 2.25rem;
		}

		.section-head {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: .5rem 1.5rem;
			flex-wrap: wrap;
			margin-bottom: .35rem;
		}

		.section h2 {
			margin: 0;
			font-size: 1.125rem;
			font-weight: 620;
			letter-spacing: -.012em;
			outline: none;
		}

		.section h2:focus-visible {
			outline: 2px solid var(--ring);
			outline-offset: 4px;
		}

		.link {
			color: var(--accent);
			text-decoration: underline;
			text-decoration-thickness: 1px;
			text-underline-offset: .18em;
		}

		.link:hover {
			text-decoration-thickness: 2px;
		}

		.table {
			width: 100%;
			border-collapse: collapse;
			font-size: .9375rem;
		}

		.table th {
			padding: .45rem .9rem .45rem 0;
			border-bottom: 1px solid var(--rule-strong);
			color: var(--ink-3);
			font-size: .75rem;
			font-weight: 600;
			letter-spacing: .05em;
			text-align: left;
			text-transform: uppercase;
			white-space: nowrap;
		}

		.table td {
			padding: .7rem .9rem .7rem 0;
			border-bottom: 1px solid var(--rule);
			vertical-align: baseline;
		}

		.table tr:last-child td {
			border-bottom: 0;
		}

		.table .num {
			padding-right: 0;
			text-align: right;
			white-space: nowrap;
		}

		.cell-title {
			width: 100%;
			min-width: 0;
		}

		.rowlink {
			color: var(--ink);
			font-weight: 560;
			text-decoration: none;
			overflow-wrap: anywhere;
		}

		.rowlink:hover,
		.rowlink:focus-visible {
			text-decoration: underline;
			text-decoration-thickness: 1px;
			text-underline-offset: .18em;
			text-decoration-color: var(--accent);
		}

		.rowmeta {
			display: none;
			margin-top: .15rem;
			color: var(--ink-2);
			font-size: .8125rem;
		}

		.badge {
			display: inline-block;
			margin-inline-start: .5rem;
			padding: .05rem .35rem;
			border: 1px solid var(--rule-strong);
			border-radius: 2px;
			color: var(--ink-2);
			font-size: .75rem;
			font-weight: 550;
			vertical-align: .05em;
		}

		.muted {
			color: var(--ink-2);
			font-size: .875rem;
		}

		.empty {
			max-width: 64ch;
			margin: .9rem 0 0;
			color: var(--ink-2);
		}

		.search {
			display: flex;
			gap: .5rem;
			flex-wrap: wrap;
			margin: .5rem 0 1rem;
		}

		.search input {
			flex: 1 1 16rem;
			min-width: 0;
			min-height: 2.25rem;
			padding: .4rem .6rem;
			border: 1px solid var(--rule-strong);
			border-radius: 2px;
			background: var(--plane);
			color: var(--ink);
			font: inherit;
		}

		.search input::placeholder {
			color: var(--ink-3);
		}

		.pager {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			flex-wrap: wrap;
			margin-top: 1rem;
			color: var(--ink-2);
			font-size: .875rem;
		}

		.pager .pairs {
			display: flex;
			gap: .5rem;
		}

		.meta {
			display: flex;
			gap: .35rem 1.5rem;
			flex-wrap: wrap;
			margin: .4rem 0 0;
			color: var(--ink-2);
			font-size: .875rem;
		}

		.meta div {
			display: flex;
			gap: .4rem;
		}

		.meta dt {
			color: var(--ink-3);
		}

		.meta dd {
			margin: 0;
		}

		code {
			overflow-wrap: anywhere;
			color: var(--ink-2);
			font: .8125rem/1.5 var(--mono);
		}

		.backlink {
			display: inline-block;
			margin-bottom: .5rem;
			font-size: .875rem;
		}

		.legacy-note {
			max-width: 68ch;
			margin: .6rem 0 0;
			color: var(--ink-2);
			font-size: .875rem;
		}

		.detail-facts {
			margin: 1rem 0 0;
			border-top: 1px solid var(--ink);
		}

		.detail-facts div {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			align-items: baseline;
			gap: .35rem 1.5rem;
			padding: .6rem 0;
			border-bottom: 1px solid var(--rule);
		}

		.detail-facts dt {
			color: var(--ink-2);
		}

		.detail-facts dd {
			margin: 0;
			font-size: 1.0625rem;
			font-weight: 600;
			text-align: right;
			overflow-wrap: anywhere;
		}

		.detail-facts div.lead dd {
			font-size: 1.875rem;
			font-weight: 620;
			letter-spacing: -.025em;
		}

		.blocks td:first-child {
			color: var(--ink-3);
			font-size: .8125rem;
			white-space: nowrap;
		}

		.blocks td.summary {
			max-width: 72ch;
			overflow-wrap: anywhere;
			white-space: pre-wrap;
		}

		.events {
			margin: 0;
			padding: 0;
			list-style: none;
		}

		.events li {
			padding: .6rem 0;
			border-bottom: 1px solid var(--rule);
		}

		.events li:last-child {
			border-bottom: 0;
		}

		.event-head {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: .5rem 1rem;
		}

		.event-kind {
			font-weight: 560;
		}

		.event-time {
			color: var(--ink-3);
			font-size: .8125rem;
			white-space: nowrap;
		}

		.diag {
			margin-top: .3rem;
		}

		.diag summary {
			color: var(--accent);
			font-size: .8125rem;
			cursor: pointer;
		}

		.diag pre {
			margin: .4rem 0 0;
			padding: .55rem .7rem;
			border: 1px solid var(--rule);
			background: var(--plane-2);
			color: var(--ink);
			font: .8125rem/1.5 var(--mono);
			white-space: pre-wrap;
			overflow-wrap: anywhere;
		}

		.settings {
			margin-top: 2.5rem;
			padding-top: 1.1rem;
			border-top: 1px solid var(--rule-strong);
		}

		.setting-row {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 1rem 2rem;
			flex-wrap: wrap;
		}

		.setting-copy {
			flex: 1 1 24rem;
			max-width: 68ch;
		}

		.setting-copy p {
			margin: 0;
		}

		.setting-copy .help {
			margin-top: .2rem;
			color: var(--ink-2);
			font-size: .875rem;
		}

		.switch {
			display: inline-flex;
			align-items: center;
			gap: .55rem;
			min-height: 2.25rem;
			cursor: pointer;
			font-size: .875rem;
			font-weight: 550;
		}

		.switch input {
			width: 1.1rem;
			height: 1.1rem;
			margin: 0;
			accent-color: var(--accent);
		}

		.status {
			margin: .5rem 0 0;
			min-height: 1.35rem;
			color: var(--ink-2);
			font-size: .875rem;
		}

		.status[data-tone="ok"] {
			color: var(--ok);
		}

		.status[data-tone="bad"] {
			color: var(--bad);
		}

		.login {
			max-width: 34rem;
		}

		.login h2 {
			margin: 0 0 .4rem;
			font-size: 1.25rem;
			font-weight: 620;
			letter-spacing: -.015em;
			outline: none;
		}

		.login .lead {
			margin: 0 0 1.35rem;
			color: var(--ink-2);
		}

		.field {
			display: block;
			margin-bottom: .55rem;
			color: var(--ink-2);
			font-size: .8125rem;
			font-weight: 550;
		}

		.field input {
			display: block;
			width: 100%;
			min-height: 2.5rem;
			margin-top: .3rem;
			padding: .45rem .6rem;
			border: 1px solid var(--rule-strong);
			border-radius: 2px;
			background: var(--plane);
			color: var(--ink);
			font: inherit;
			font-weight: 400;
		}

		.field input[aria-invalid="true"] {
			border-color: var(--bad);
		}

		.login .btn {
			min-height: 2.5rem;
		}

		.skeleton {
			margin-top: 1.25rem;
		}

		.skeleton div {
			height: 1.9rem;
			margin-bottom: .55rem;
			background: var(--plane-2);
		}

		.skeleton div:nth-child(2) {
			width: 82%;
		}

		.skeleton div:nth-child(3) {
			width: 64%;
		}

		.skeleton div:nth-child(4) {
			width: 74%;
		}

		.colophon {
			margin-top: 3.5rem;
			padding-top: .8rem;
			border-top: 1px solid var(--rule);
			color: var(--ink-3);
			font-size: .8125rem;
		}

		.colophon p {
			margin: 0 0 .3rem;
		}

		@media (max-width: 45rem) {

			.col-model,
			.col-proto {
				display: none;
			}

			.rowmeta {
				display: block;
			}

			.btn,
			.search input,
			.switch,
			.lang button {
				min-height: 2.75rem;
			}
		}

		@media (max-width: 34rem) {
			.col-updated {
				display: none;
			}

			.event-head {
				flex-wrap: wrap;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			* {
				transition: none !important;
			}
		}
	</style>
	<style id="provider-cache-style">
		.provider-cache {
			padding: 1rem 0;
			border-block: 1px solid var(--rule);
		}

		.cache-head {
			display: flex;
			align-items: baseline;
			flex-wrap: wrap;
			gap: .65rem 1rem;
		}

		.cache-head h2 {
			font-size: 1.05rem;
			margin: 0;
		}

		.cache-head strong {
			font-size: 1.45rem;
			font-weight: 650;
			color: var(--accent);
			font-variant-numeric: tabular-nums;
		}

		.cache-readings {
			display: flex;
			flex-wrap: wrap;
			gap: .6rem 2rem;
			margin: .65rem 0;
		}

		.cache-readings dt {
			font-size: .8rem;
			color: var(--ink-2);
		}

		.cache-readings dd {
			margin: 0;
			font-weight: 600;
			font-variant-numeric: tabular-nums;
		}

		.cache-comparison summary {
			cursor: pointer;
			width: fit-content;
			color: var(--ink);
			font-size: .85rem;
			padding: .35rem 0;
		}

		.cache-comparison p {
			max-width: 65ch;
			margin: 0;
		}

		:root {
			--plane: #f3f6f3;
			--plane-2: #e7eeea;
			--ink: #203a36;
			--ink-2: #445e58;
			--ink-3: #526962;
			--accent: #17665e;
			--accent-2: #104c46;
			--rule: #cbd7d0;
			--rule-strong: #91a79c;
			--ring: #19766a;
			--shell: #18574f
		}

		@media(prefers-color-scheme:dark) {
			:root {
				--plane: #141e1c;
				--plane-2: #1d2c27;
				--ink: #e4eee9;
				--ink-2: #b4c6bd;
				--ink-3: #a2b6ab;
				--accent: #7dc8af;
				--accent-2: #a7dfcb;
				--rule: #354a40;
				--rule-strong: #647c6e;
				--ring: #a5ddc4;
				--shell: #194c44;
				--on-accent: #10231b
			}
		}

		.app {
			max-width: 100rem;
			padding: 0 clamp(1rem, 3.4vw, 3.5rem) 3rem;
		}

		.masthead {
			margin: 0 calc(-1 * clamp(1rem, 3.4vw, 3.5rem));
			padding: 1.1rem max(20rem, 22%) 1.1rem clamp(1rem, 3.4vw, 3.5rem);
			background: var(--shell);
			border: 0;
			color: #fff;
			flex-direction: row;
			align-items: center;
			gap: 1.2rem 2.25rem;
			flex-wrap: wrap;
		}

		.masthead .tagline {
			color: #d2e4dc
		}

		.masthead .tip {
			color: var(--ink)
		}

		main {
			padding-top: 0
		}

		.journal-nav {
			display: flex;
			gap: 1.5rem;
			align-items: baseline;
			border-bottom: 1px solid var(--rule-strong);
			padding-right: 19rem
		}

		.journal-nav a {
			padding: .65rem 0;
			color: var(--ink-2);
			font-weight: 550;
			text-decoration: none;
			border-bottom: 2px solid transparent
		}

		.journal-nav a[aria-current=page] {
			color: var(--accent);
			border-color: var(--accent)
		}

		.journal-title {
			font-size: clamp(1.75rem, 3.2vw, 2.8rem);
			letter-spacing: -.035em;
			line-height: 1.12;
			margin: 1.55rem 0 1rem
		}

		.journal-metrics {
			display: grid;
			grid-template-columns: 1fr 1.25fr;
			gap: 2.5rem;
			border-top: 2px solid var(--accent);
			border-bottom: 1px solid var(--rule-strong);
			padding: 1.1rem 0
		}

		.journal-savings h3 {
			margin: 0;
			font-size: 1rem;
			font-weight: 550
		}

		.saved-value {
			font-variant-numeric: tabular-nums;
			font-size: clamp(2.8rem, 5vw, 4.3rem);
			letter-spacing: -.035em;
			line-height: 1.15
		}

		.journal-savings p,
		.fold-receipt p {
			margin: .25rem 0
		}

		.journal-metrics .provider-cache {
			padding: 0;
			border: 0
		}

		.journal-body {
			display: grid;
			grid-template-columns: minmax(0, 2.25fr) minmax(18rem, 1fr);
			gap: 2.3rem;
			margin-top: 1.4rem
		}

		.journal-body h2 {
			font-size: 1.12rem;
			margin: 0 0 .55rem
		}

		.fold-receipt {
			padding-left: 1.4rem;
			border-inline-start: 1px solid var(--rule-strong)
		}

		.latest-state {
			color: var(--ok);
			font-weight: 600
		}

		.latest-value {
			font-size: 2.3rem;
			letter-spacing: -.025em
		}

		.latest-events {
			list-style: none;
			padding: 0;
			margin: 1rem 0
		}

		.latest-events li {
			display: grid;
			gap: .3rem .85rem;
			grid-template-columns: minmax(5rem, 1fr) 1.1fr;
			border-top: 1px solid var(--rule);
			padding: .4rem 0
		}

		.latest-events time {
			color: var(--ink-2);
			font-size: .8rem
		}

		.journal .table .col-proto,
		.journal .table .col-updated {
			display: none
		}

		.journal .table .num {
			padding-inline: .55rem
		}

		.table .col-model {
			white-space: nowrap
		}

		.detail-facts {
			margin-bottom: 1rem
		}

		.journal-list {
			min-width: 0
		}

		.journal .table tr:last-child td {
			border-bottom: 1px solid var(--rule)
		}

		@media(max-width:59.999rem) {
			.masthead {
				padding: 1rem;
				min-height: 8.4rem;
				flex-direction: column;
				align-items: flex-start;
				gap: .45rem
			}

			.masthead .controls {
				margin-top: 4.6rem
			}

			.brand .tagline {
				max-width: 40%
			}

			.journal-nav {
				padding-right: 0
			}

			.journal-metrics {
				grid-template-columns: 1fr;
				gap: .8rem
			}

			.journal-metrics .provider-cache {
				border-top: 1px solid var(--rule);
				padding-top: .65rem
			}

			.journal-body {
				grid-template-columns: 1fr;
				gap: 1.4rem
			}

			.fold-receipt {
				padding: .85rem 0 0;
				border-inline-start: 0;
				border-block-start: 1px solid var(--rule)
			}

			.journal .table .num {
				padding-inline: .35rem
			}

			.journal-title {
				margin: .9rem 0 .6rem
			}

			.journal-nav a {
				padding: .6rem 0
			}

			.journal .col-model {
				display: none
			}

			.saved-value {
				font-size: 2.7rem
			}

			.brand h1 {
				max-width: 80vw
			}
		}

		.row-outcome {
			display: block;
			color: var(--ink-2);
			font-size: .81rem;
			line-height: 1.45;
			margin: .1rem 0
		}

		.table .num {
			padding-inline: .6rem
		}

		.table .col-updated {
			white-space: nowrap
		}

		.table .cell-title {
			width: auto;
			min-width: 9rem
		}

		.table .col-model {
			min-width: 6rem
		}

		.table th.num+th.num,
		.table td.num+td.num {
			padding-inline-start: 1.1rem
		}

		.journal-list .cell-title {
			width: 54%
		}

		@media(max-width:45rem) {
			.table .cell-title {
				min-width: 0
			}

			.table .num {
				padding-inline: .3rem
			}

			.table th.num+th.num,
			.table td.num+td.num {
				padding-inline-start: .7rem
			}

			.journal-list .cell-title {
				width: auto
			}
		}
	</style>

				return h('section', {'aria-labelledby': 'view-heading'},
					h('div', {class: 'section-head'},
						h('h2', {id: 'view-heading', tabindex: '-1', text: t('sessions.heading')}),
						total === null ? null : h('span', {class: 'muted', id: 'session-total', text: t('sessions.total', {n: formatNumber(total)})})),
					form,
					rows.length
						? sessionTable(rows, t('sessions.heading'))
						: h('p', {class: 'empty', text: view.q ? t('sessions.noMatch', {q: view.q}) : t('sessions.empty')}),
					rows.length ? pager : null);
			}

			function detailView(view, data) {
				const session = data.session && typeof data.session === 'object' ? data.session : null;
				if (!session) {
					return h('section', {'aria-labelledby': 'view-heading'},
						h('h2', {id: 'view-heading', tabindex: '-1', text: t('error.title')}),
						h('p', {class: 'status', role: 'alert', 'data-tone': 'bad', text: t('error.notFound')}),
						h('p', {}, h('a', {class: 'link', href: lastSessionsHash, text: t('detail.back')})));
				}

				const blocks = Array.isArray(data.blocks) ? data.blocks.filter(item => item && typeof item === 'object') : [];
				const events = Array.isArray(data.events) ? data.events.filter(item => item && typeof item === 'object') : [];
				const updated = formatDate(session.updatedAt);

				const facts = h('dl', {class: 'detail-facts'},
					h('div', {class: 'lead'},
						h('dt', {text: t('overview.saved')}),
						h('dd', {text: formatMetric(session.tokensSaved, t('detail.unknown'))})),
					h('div', {},
						h('dt', {text: t('detail.id')}),
						h('dd', {}, h('code', {text: text(session.id)}))),
					text(session.model) ? h('div', {}, h('dt', {text: t('detail.model')}), h('dd', {text: session.model})) : null,
					text(session.protocol) ? h('div', {}, h('dt', {text: t('detail.protocol')}), h('dd', {text: session.protocol})) : null,
					updated ? h('div', {}, h('dt', {text: t('detail.updated')}), h('dd', {}, h('time', {datetime: session.updatedAt, text: updated}))) : null);

				const blocksTable = blocks.length
					? h('table', {class: 'table blocks'},
						h('caption', {class: 'sr-only', text: t('detail.blocks')}),
						h('thead', {}, h('tr', {},
							h('th', {scope: 'col', text: t('table.blocks')}),
							h('th', {scope: 'col', text: t('detail.blocks')}),
							h('th', {scope: 'col', class: 'num', text: t('table.saved')}))),
						h('tbody', {}, blocks.map((block, index) => h('tr', {},
							h('td', {text: text(block.id) || '#' + (index + 1)}),
							h('td', {class: 'summary', text: text(block.summary)}),
							h('td', {class: 'num', text: formatMetric(block.tokensSaved)})))))
					: h('p', {class: 'empty', text: t('detail.noBlocks')});

				const eventsList = events.length
					? h('div', {},
						h('p', {class: 'totals-note', text: t('detail.disclosure')}),
						h('ul', {class: 'events'}, events.map(event => {
							const at = formatDate(event.at);
							const message = text(event.message);
							return h('li', {},
								h('div', {class: 'event-head'},
									h('span', {class: 'event-kind', text: eventLabel(event.kind)}),
									at ? h('time', {class: 'event-time', datetime: event.at, text: at}) : null),
								message ? h('details', {class: 'diag'},
									h('summary', {text: t('detail.eventDetails')}),
									h('pre', {text: message})) : null);
						})))
					: h('p', {class: 'empty', text: t('detail.noEvents')});

				return h('section', {'aria-labelledby': 'view-heading'},
					h('a', {class: 'link backlink', id: 'back', href: lastSessionsHash, text: '← ' + t('detail.back')}),
					h('h2', {id: 'view-heading', tabindex: '-1', text: text(session.title).trim() || t('session.untitled')}),
					session.legacy === true
						? h('p', {class: 'legacy-note'}, h('span', {class: 'badge', text: t('session.legacy')}), ' ' + t('session.legacyNote'))
						: null,
					h('p', {class: 'muted', text: t('detail.blocksCount', {n: formatNumber(blocks.length)})}),
					facts,
					providerCacheView(data),
					h('section', {class: 'section', 'aria-labelledby': 'blocks-heading'},
						h('div', {class: 'section-head'}, h('h2', {id: 'blocks-heading', text: t('detail.blocks')})),
						blocksTable),
					h('section', {class: 'section', 'aria-labelledby': 'events-heading'},
						h('div', {class: 'section-head'}, h('h2', {id: 'events-heading', text: t('detail.events')})),
						eventsList));
			}

			function sessionTable(rows, caption) {
				return h('table', {class: 'table'},
					h('caption', {class: 'sr-only', text: caption}),
					h('thead', {}, h('tr', {},
						h('th', {scope: 'col', text: t('table.session')}),
						h('th', {scope: 'col', class: 'col-model', text: t('table.model')}),
						h('th', {scope: 'col', class: 'col-proto', text: t('table.protocol')}),
						h('th', {scope: 'col', class: 'col-updated', text: t('table.updated')}),
						h('th', {scope: 'col', class: 'num', text: t('table.blocks')}),
						h('th', {scope: 'col', class: 'num', text: t('table.saved')}))),
					h('tbody', {}, rows.map(sessionRow)));
			}

			function sessionRow(session) {
				const id = text(session.id);
				const title = text(session.title).trim() || t('session.untitled');
				const updated = formatDate(session.updatedAt);
				const linkable = safeID.test(id);
				const name = linkable
					? h('a', {class: 'rowlink', href: '#/sessions/' + encodeURIComponent(id), text: title})
					: h('span', {class: 'rowlink', text: title});
				const meta = [text(session.model), text(session.protocol), updated].filter(Boolean).join(' · ');
				return h('tr', {},
					h('td', {class: 'cell-title'}, name,
						session.legacy ? null : h('span', {class: 'row-outcome', text: session.lastEvent ? eventLabel(session.lastEvent) : ({ru: 'Нет записанных попыток', en: 'No attempts recorded', zh: '尚无已记录的尝试'}[language])}),
						session.legacy === true ? h('span', {class: 'badge', text: t('session.legacy')}) : null,
						meta ? h('span', {class: 'rowmeta', text: meta}) : null),
					h('td', {class: 'col-model'}, h('code', {text: text(session.model)})),
					h('td', {class: 'col-proto', text: text(session.protocol)}),
					h('td', {class: 'col-updated'}, updated ? h('time', {datetime: session.updatedAt, text: updated}) : null),
					h('td', {class: 'num', text: formatMetric(session.blocks)}),
					h('td', {class: 'num', text: formatMetric(session.tokensSaved)}));
			}

			function settingsView() {
				const pending = markerSaving;
				const reported = typeof markers === 'boolean';
				const shown = pending ? pending.wanted : markers === true;
				const input = h('input', {
					type: 'checkbox', id: 'markers', role: 'switch', checked: shown, disabled: Boolean(pending) || !reported,
				});
				const state = h('span', {
					id: 'marker-state',
					text: pending ? (pending.wanted ? t('settings.shown') : t('settings.hidden'))
						: reported ? (markers ? t('settings.shown') : t('settings.hidden')) : t('settings.unreported'),
				});
				const status = h('p', {
					class: 'status', id: 'marker-status', role: 'status',
					'data-tone': markerStatus ? markerStatus.tone : null,
					text: markerStatus ? t(markerStatus.key, markerStatus.vars) : '',
				});
				input.addEventListener('change', () => saveMarkers(input));

				return h('section', {class: 'settings', 'aria-labelledby': 'settings-heading'},
					h('div', {class: 'section-head'}, h('h2', {id: 'settings-heading', text: t('settings.heading')})),
					h('div', {class: 'setting-row'},
						h('div', {class: 'setting-copy'},
							h('p', {}, h('strong', {text: t('settings.label')})),
							h('p', {class: 'help', text: t('settings.help')})),
						h('label', {class: 'switch'}, input, state)),
					status,
					noticeDismissed
						? h('button', {
							type: 'button', id: 'restore-notice', class: 'btn small', text: t('settings.showNotice'),
							onclick: restoreNotice,
						})
						: null);
			}

			// The server-confirmed value is the only source of truth. A render, a
			// language change or a failed save never replaces it. A payload read
			// before a newer confirmation is not adopted over that confirmation.
			function adoptMarkers(data, epoch) {
				if (markerSaving || epoch !== markerEpoch) return;
				markers = typeof data.visibilityMarkers === 'boolean' ? data.visibilityMarkers : null;
			}

			function confirmMarkers(value) {
				markerEpoch++;
				markers = value;
				if (viewState.phase === 'ready' && viewState.view && viewState.view.kind === 'settings' && viewState.data && typeof viewState.data === 'object') {
					viewState.data.visibilityMarkers = value;
				}
			}

			function resetMarkers() {
				markerToken++;
				markerSaving = null;
				markerStatus = null;
				markers = null;
			}

			async function saveMarkers(input) {
				if (markerSaving) return;
				const wanted = input.checked === true;
				const token = ++markerToken;
				markerSaving = {wanted};
				markerStatus = {tone: null, key: 'settings.saving'};
				render();
				let response = null;
				let body = null;
				try {
					response = await read('/__bili/settings', {method: 'PUT', body: {visibilityMarkers: wanted}, signal: AbortSignal.timeout(20000)});
					if (response.ok) body = await response.json();
				} catch {
					response = null;
					body = null;
				}
				// A newer save, a lock or a logout owns the state now; only the
				// request that still holds the token is allowed to clear pending.
				if (token !== markerToken) return;
				markerSaving = null;
				if (!response) {
					markerStatus = {tone: 'bad', key: 'settings.failed'};
				} else if (response.status === 401 || response.status === 403) {
					markerStatus = null;
					lockOut(t('error.rejected'));
					return;
				} else if (!response.ok) {
					// The read copies talk about views; a save failure either means
					// storage is unavailable or that the change was not confirmed.
					markerStatus = response.status === 503 ? {tone: 'bad', key: 'error.unavailable'} : {tone: 'bad', key: 'settings.failed'};
				} else {
					const confirmed = body && typeof body === 'object' ? body.visibilityMarkers : undefined;
					if (typeof confirmed === 'boolean') confirmMarkers(confirmed);
					markerStatus = confirmed === wanted ? {tone: 'ok', key: 'settings.saved'} : {tone: 'bad', key: 'settings.failed'};
				}
				render();
			}

			function setLanguage(named) {
				if (!languages.includes(named) || named === language) return;
				language = named;
				try {localStorage.setItem(savedLanguage, named);} catch { }
				render();
			}

			function lockDashboard() {
				key = '';
				openGeneration++;
				viewToken++;
				resetMarkers();
				clearSavedKey();
				viewState = {phase: 'login', message: ''};
				render();
				location.reload();
			}

			// Locking in one tab must revoke the live key everywhere, including an
			// open that is still awaiting CPA. This listener is installed before any
			// open starts, so a pending request cannot restore the key afterwards.
			window.addEventListener('storage', event => {
				if (event.key !== savedKey || event.newValue !== null) return;
				openGeneration++;
				key = '';
				location.reload();
			});

			async function open(candidate, ui) {
				const generation = ++openGeneration;
				const input = ui?.input ?? null;
				const submit = ui?.submit ?? null;
				const status = ui?.status ?? null;
				if (input) input.setAttribute('aria-invalid', 'false');
				if (submit) {
					submit.disabled = true;
					submit.textContent = t('login.busy');
				}
				if (status) {
					status.removeAttribute('data-tone');
					status.textContent = t('login.busy');
				}
				let response = null;
				let failed = false;
				try {
					response = await read('/__bili/overview', {candidate, signal: AbortSignal.timeout(20000)});
				} catch {
					failed = true;
				}
				if (generation !== openGeneration) return;
				if (submit) {
					submit.disabled = false;
					submit.textContent = t('login.submit');
				}
				if (input) input.value = '';
				const restore = message => {
					if (status) {
						status.setAttribute('data-tone', 'bad');
						status.textContent = message;
					}
					if (input) {
						input.setAttribute('aria-invalid', 'true');
						input.focus();
					}
				};
				if (failed) {
					restore(t('login.offline'));
					return;
				}
				if (response.status === 401 || response.status === 403) {
					clearSavedKey();
					restore(t('login.rejected'));
					return;
				}
				if (!response.ok) {
					restore(t('login.unreachable', {status: String(response.status)}));
					return;
				}
				let data = null;
				try {data = await response.json();} catch {data = null;}
				if (generation !== openGeneration) return;
				if (!data || typeof data !== 'object' || Array.isArray(data)) {
					restore(t('login.unreachable', {status: String(response.status)}));
					return;
				}
				if (generation !== openGeneration) return;
				try {localStorage.setItem(savedKey, candidate);} catch { }
				key = candidate;
				viewState = {phase: 'ready', view: {kind: 'overview'}, data};
				render();
				await load(location.hash, data);
			}

			async function load(hash, preload) {
				// Every entry point invalidates the previous read, including the
				// early returns below: a stale confirmation or error must not paint
				// over the route the user has moved to.
				const token = ++viewToken;
				// A payload is adopted only if no newer confirmation landed while
				// the read was in flight.
				const epoch = markerEpoch;
				const view = parseView(hash);
				if (!view) {
					history.replaceState(null, '', '#/overview');
					return load('#/overview', preload);
				}
				if (view.kind === 'detail' && !safeID.test(view.id)) {
					viewState = {phase: 'error', message: t('error.invalid'), retry: lastSessionsHash};
					render();
					return;
				}
				if (view.kind === 'sessions') lastSessionsHash = hash;
				if (!key) {
					viewState = {phase: 'login', message: ''};
					render();
					return;
				}
				if (view.kind === 'overview' && preload && typeof preload === 'object') {
					adoptMarkers(preload, epoch);
					viewState = {phase: 'ready', view, data: preload};
					render();
					return;
				}
				viewState = {phase: 'loading', view};
				render();
				let response = null;
				let failed = false;
				try {
					response = await read(targetFor(view), {signal: AbortSignal.timeout(20000)});
				} catch {
					failed = true;
				}
				if (token !== viewToken || !key) return;
				if (failed) {
					viewState = {phase: 'error', message: t('error.offline'), retry: hash};
					render();
					return;
				}
				if (response.status === 401 || response.status === 403) {
					lockOut(t('error.rejected'));
					return;
				}
				if (!response.ok) {
					viewState = {phase: 'error', message: failureMessage(response.status), retry: hash};
					render();
					return;
				}
				let data = null;
				try {data = await response.json();} catch {data = null;}
				if (token !== viewToken || !key) return;
				if (!data || typeof data !== 'object' || Array.isArray(data)) {
					viewState = {phase: 'error', message: t('error.read'), retry: hash};
					render();
					return;
				}
				adoptMarkers(data, epoch);
				viewState = {phase: 'ready', view, data};
				render();
				if (view.kind !== 'overview') focusView();
			}

			window.addEventListener('hashchange', () => {
				if (key) load(location.hash);
				else render();
			});

			window.addEventListener('pagehide', () => {key = '';}, {once: true});
			window.addEventListener('pageshow', event => {
				if (event.persisted) location.reload();
			});

			const stored = storeGet(savedKey);
			if (stored) {
				key = stored;
				load(location.hash);
			} else {
				render();
			}
		})();
	</script>
</body>

</html>
