<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Billion Context</title>
	<style>
		body {
			font: 1rem/1.5 system-ui, sans-serif;
			margin: 0;
		}

		main {
			max-width: 32rem;
			margin: 3rem auto;
			padding: 0 1rem;
		}

		label,
		input {
			display: block;
		}

		input,
		button {
			font: inherit;
			padding: .4rem .6rem;
		}

		input {
			box-sizing: border-box;
			width: 100%;
			margin: .25rem 0 .75rem;
		}
	</style>
</head>

<body>
	<main>
		<h1>Billion Context</h1>
		<p>Use your CPA management key to open read-only Overview and Sessions. An accepted key stays in this browser
			until you lock the WebUI or CPA rejects it.</p>
		<form autocomplete="off">
			<label for="management-key">CPA management key</label>
			<input id="management-key" type="password" aria-describedby="status" required>
			<button type="submit">Open Billion Context</button>
		</form>
		<p id="status" role="status"></p>
		<progress aria-label="Opening the bili WebUI" hidden></progress>
	</main>
	<script>
		(() => {
			const form = document.querySelector('form');
			const input = document.getElementById('management-key');
			const button = form.querySelector('button');
			const status = document.getElementById('status');
			const progress = document.querySelector('progress');
			const nativeFetch = window.fetch.bind(window);
			const root = '/__bili/';
			const route = '/v0/management/plugins/omp-billion-context/webui-data';
			const savedKey = 'omp-billion-context.management-key';
			const dismissPaths = new Map([
				[root + 'notices/dismiss', 'notices'],
				[root + 'host-plugins/dismiss', 'hostPluginNotices'],
			]);
			const denied = response => response.status === 401 || response.status === 403;
			const validID = id => typeof id === 'string' && id.length > 0 && id.length <= 256;
			const dismissLimit = 64;
			const dismissed = new Map();
			for (const list of dismissPaths.values()) {
				let ids = [];
				try {
					const saved = JSON.parse(localStorage.getItem('omp-billion-context.' + list));
					if (Array.isArray(saved)) ids = saved.slice(-dismissLimit).filter(validID);
				} catch { }
				dismissed.set(list, new Set(ids));
			}

			function clearSavedKey() {
				try {localStorage.removeItem(savedKey);} catch { }
				try {sessionStorage.removeItem(savedKey);} catch { }
			}

			function read(target, key, signal) {
				return nativeFetch(route + '?' + new URLSearchParams({target}), {
					headers: {'X-Management-Key': key}, credentials: 'omit', cache: 'no-store', redirect: 'error', signal,
				});
			}

			function jsonResponse(status, data) {
				return new Response(JSON.stringify(data), {
					status, headers: {'Content-Type': 'application/json', 'Cache-Control': 'no-store'},
				});
			}

			async function dismiss(request, list) {
				let id;
				try {id = (await request.json())?.id;} catch { }
				if (!validID(id)) return jsonResponse(400, {error: 'Invalid notice ID.'});
				const ids = dismissed.get(list);
				if (!ids.has(id)) {
					ids.add(id);
					if (ids.size > dismissLimit) ids.delete(ids.values().next().value);
					try {localStorage.setItem('omp-billion-context.' + list, JSON.stringify([...ids]));} catch { }
				}
				return jsonResponse(200, {ok: true});
			}

			async function filterOverview(response) {
				if (![...dismissed.values()].some(ids => ids.size)) return response;
				let data;
				try {data = await response.clone().json();} catch {return response;}
				if (!data || typeof data !== 'object') return response;
				for (const [list, ids] of dismissed) {
					if (ids.size && Array.isArray(data[list])) data[list] = data[list].filter(item => !ids.has(item?.id));
				}
				return jsonResponse(response.status, data);
			}

			function normalizeHash() {
				const hash = location.hash;
				if (!hash || /^#\/(overview|sessions)$/.test(hash)) return;
				if (/^#\/sessions?\/[A-Za-z0-9][A-Za-z0-9._-]*$/.test(hash)) return;
				history.replaceState(history.state, '', '#/overview');
			}

			function showNativeUI(html, key) {
				window.fetch = async (input, init) => {
					const request = new Request(input, init);
					const target = new URL(request.url);
					if (target.origin !== location.origin || !target.pathname.startsWith(root)) return nativeFetch(request);
					if (!key) return jsonResponse(401, {error: 'Reopen Billion Context with your CPA management key.'});
					if (request.method === 'POST' && target.href === target.origin + target.pathname && dismissPaths.has(target.pathname)) {
						return dismiss(request, dismissPaths.get(target.pathname));
					}
					if (request.method !== 'GET') return jsonResponse(405, {error: 'The CPA WebUI is read-only.'});
					const response = await read(target.pathname + target.search, key, request.signal);
					if (denied(response)) {
						key = '';
						clearSavedKey();
						const warning = document.getElementById('cpa-webui-status');
						if (warning) warning.textContent = 'CPA no longer accepts this key. Lock the WebUI and enter your current key.';
					}
					if (response.ok && target.pathname === root + 'overview' && !target.search) return filterOverview(response);
					return response;
				};
				// Register before bili's router. document.open() clears existing listeners.
				document.open();
				normalizeHash();
				window.addEventListener('hashchange', normalizeHash, true);
				document.write(html.replace('id="changelog-body"', ''));
				document.close();

				const style = document.createElement('style');
				style.textContent = `
					.embed .topbar { display: flex; }
					.embed [data-nav]:not([data-nav="overview"]):not([data-nav="sessions"]),
					.embed .fork-link, #page-config, #page-connect, #page-logs, #page-updates, #page-blog,
					#update-banner, #update-policy-banner,
					#session-detail-view .k:has(+ .v > a[href^="#/logs?"]),
					#session-detail-view .v:has(> a[href^="#/logs?"]) { display: none !important; }
					#cpa-webui-notice {
						display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem;
						box-sizing: border-box; min-height: 0; padding: .25rem .5rem .25rem .75rem;
						font-size: .8125rem; line-height: 1.4;
						background: var(--bg-muted); border-bottom: 1px solid var(--border);
					}
					#cpa-webui-notice span { flex: 1 1 12rem; }
					/* Let the title use the full width of its elastic column. */
					.embed .twide .row-title,
					.embed .twide .w-title { max-width: none; }
					.embed .twide .row-title { flex: 0 1 auto; min-width: 0; }
					.embed .twide .slink {
						display: flex; align-items: center; column-gap: .4rem; min-width: 0;
					}
					.embed .twide .slink > .badge { flex: none; white-space: nowrap; }
					.embed .twide .row-id {
						flex: none; margin-top: 0; max-width: 5.5em;
						font-size: 10.5px; line-height: 1.2;
					}
					@media (min-width: 721px) {
						.embed .twide table.data:not(.columns-resized) colgroup col:nth-child(2) { width: 10rem !important; }
						.embed .twide .client-cell { white-space: nowrap; overflow: hidden; }
						.embed .twide .client-cell .w-client { max-width: calc(100% - 3rem); }
					}
					@media (max-width: 720px) {
						.embed .twide table.data th:nth-child(2),
						.embed .twide table.data td:nth-child(2),
						.embed .twide table.data th:nth-child(4),
						.embed .twide table.data td:nth-child(4) { display: none; }
						.embed .twide table.data colgroup col:nth-child(2),
						.embed .twide table.data colgroup col:nth-child(4) { width: 0 !important; }
						.embed .twide .slink { flex-wrap: wrap; align-items: flex-start; row-gap: .15rem; }
						.embed .twide .row-title {
							flex: 1 1 100%;
							display: -webkit-box; -webkit-box-orient: vertical;
							-webkit-line-clamp: 2; white-space: normal;
						}
					}
				`;
				document.head.append(style);
				const notice = document.createElement('aside');
				notice.id = 'cpa-webui-notice';
				notice.setAttribute('aria-label', 'CPA WebUI access');
				notice.innerHTML = `<span><strong>Router priority:</strong> If you use other model routers, set bili’s priority higher than theirs. Equal or unset priorities can let another router handle a request before compression. Overview and Sessions are read-only here.</span>
					<button class="btn sm" type="button">Lock WebUI</button><span id="cpa-webui-status" role="status"></span>`;
				notice.querySelector('button').addEventListener('click', () => {
					key = '';
					clearSavedKey();
					location.reload();
				});
				document.body.prepend(notice);

				// Keep native links and keyboard navigation when bili replaces the table body.
				const decorateRows = () => {
					for (const body of document.querySelectorAll('#sessions-body, #recent-body')) {
						for (const anchor of body.querySelectorAll('a.slink')) {
							if (anchor.dataset.ompDecorated) continue;
							anchor.dataset.ompDecorated = '1';
							const name = anchor.querySelector('.row-title');
							const handle = anchor.querySelector('.row-id');
							const cells = anchor.closest('td')?.parentElement?.children || [];
							const client = body.id === 'sessions-body' ? cells[1]?.textContent.trim() : '';
							const upstream = body.id === 'sessions-body' ? cells[3]?.textContent.trim() : '';
							const lines = [name?.textContent, client, upstream, handle?.textContent].filter(Boolean);
							if (lines.length) anchor.title = lines.join('\n');
						}
					}
				};
				const rowObserver = new MutationObserver(decorateRows);
				for (const body of document.querySelectorAll('#sessions-body, #recent-body')) {
					rowObserver.observe(body, {childList: true});
				}
				decorateRows();

				window.addEventListener('pagehide', () => {key = '';}, {once: true});
				window.addEventListener('pageshow', event => {
					if (event.persisted) location.reload();
				});
			}

			// Locking in one tab must revoke the live key everywhere, including an
			// open that is still awaiting CPA. This listener is installed before any
			// open starts, so a pending request cannot restore the key afterwards.
			window.addEventListener('storage', event => {
				if (event.key !== savedKey || event.newValue !== null) return;
				openGeneration++;
				key = '';
				location.reload();
			});

			async function open(candidate) {
				const generation = ++openGeneration;
				input.value = '';
				input.removeAttribute('aria-invalid');
				button.disabled = true;
				progress.hidden = false;
				status.textContent = 'Opening the bili WebUI…';
				try {
					const response = await read(root, candidate, AbortSignal.timeout(35000));
					// A lock in another tab wins over an open already in flight,
					// otherwise this tab would store the cleared key again.
					if (generation !== openGeneration) return;
					if (denied(response)) {
						clearSavedKey();
						input.setAttribute('aria-invalid', 'true');
						status.textContent = 'CPA rejected the key. Enter your current CPA management key.';
					} else if (!response.ok || !response.headers.get('Content-Type')?.startsWith('text/html')) {
						status.textContent = 'Could not open the bili WebUI (HTTP ' + response.status + '). Try again.';
					} else {
						const html = await response.text();
						if (generation !== openGeneration) return;
						try {localStorage.setItem(savedKey, candidate);} catch { }
						showNativeUI(html, candidate);
						return;
					}
				} catch {
					if (generation !== openGeneration) return;
					status.textContent = 'Could not connect to the bili WebUI. Try again.';
				}
				if (generation !== openGeneration) return;
				progress.hidden = true;
				button.disabled = false;
				input.focus();
			}

			form.addEventListener('submit', event => {
				event.preventDefault();
				if (!button.disabled) open(input.value);
			});
			let key;
			let openGeneration = 0;
			try {key = localStorage.getItem(savedKey);} catch { }
			if (key) open(key);
		})();
	</script>
</body>

</html>
