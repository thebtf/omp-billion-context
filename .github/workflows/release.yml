name: Build CPA plugin

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: amd64
            ext: dll
            cpa_asset: CLIProxyAPI_8.1.4_windows_amd64.zip
            cpa_sha: 665b670d42a5ceeadd33a6f03dffaa362cde920b726ab6b117c4def94ff81b09
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            ext: so
            cpa_asset: CLIProxyAPI_8.1.4_linux_amd64.tar.gz
            cpa_sha: d36d5304eded3884cd0c4168c41a7638a3234631a64a54644069b963ae287cea
          - runner: macos-latest
            os: darwin
            arch: arm64
            ext: dylib
            cpa_asset: CLIProxyAPI_8.1.4_darwin_aarch64.tar.gz
            cpa_sha: 9d9e2350d4af9c2cd1c3636a5892e3b669829284f3a54b252fe1bdfb6b49d93a
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python scripts/release.py check-tag --tag "$GITHUB_REF_NAME"
          fi
          npm ci --omit=dev --ignore-scripts
          python scripts/package_runtime.py --target "$GOOS-$GOARCH"
          BILI_TEST_PROTECTED_ENGINE=1 go test ./...
          node --test test/kernel.mjs
          node test/webui-storage.mjs
          library=$(python scripts/release.py library --target "$GOOS-$GOARCH")
          go build -buildmode=c-shared -o "$library" .
          python scripts/release.py package --target "$GOOS-$GOARCH" --library "$library" --dist dist
      - name: Verify bundled compression and native replacement through CPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CPA_ASSET: ${{ matrix.cpa_asset }}
          CPA_SHA: ${{ matrix.cpa_sha }}
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p .work/tmp/cpa
          gh release download v8.1.4 --repo router-for-me/CLIProxyAPI --pattern "$CPA_ASSET" --dir .work/tmp/cpa
          python -c 'import hashlib, os, pathlib; path=pathlib.Path(".work/tmp/cpa") / os.environ["CPA_ASSET"]; assert hashlib.sha256(path.read_bytes()).hexdigest() == os.environ["CPA_SHA"], "CPA archive checksum mismatch"'
          if [[ "$CPA_ASSET" == *.zip ]]; then
            python -m zipfile -e ".work/tmp/cpa/$CPA_ASSET" .work/tmp/cpa
            cpa=.work/tmp/cpa/cli-proxy-api.exe
          else
            tar -xzf ".work/tmp/cpa/$CPA_ASSET" -C .work/tmp/cpa
            cpa=.work/tmp/cpa/cli-proxy-api
          fi
          library=$(python scripts/release.py library --target "$GOOS-$GOARCH")
          go build -buildmode=c-shared -ldflags=-buildid=bili007-replacement-fixture -o ".work/tmp/omp-billion-context-replacement.$EXT" .
          node test/smoke.mjs "$cpa" "$library" ".work/tmp/omp-billion-context-replacement.$EXT"
      - name: Preserve tested Linux replacement fixture
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: smoke_fixture_linux_amd64
          path: .work/tmp/omp-billion-context-replacement.so
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          name: windows-amd64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: darwin-arm64
          path: dist
      - name: Verify release members and rejection paths
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release.py verify --dist dist
          if python scripts/release.py check-tag --tag invalid-tag; then exit 1; fi
          mkdir -p .work/tmp
          python - <<'PY'
          import tempfile
          import zipfile
          from pathlib import Path
          from scripts.release import archive_name, verify_archive, version
          with tempfile.TemporaryDirectory(dir=".work/tmp") as directory:
              path = Path(directory) / archive_name(version(), "linux-amd64")
              with zipfile.ZipFile(path, "w") as archive:
                  archive.writestr("omp-billion-context.so", b"invalid unversioned member")
              try:
                  verify_archive(path, version(), "linux-amd64")
              except ValueError:
                  pass
              else:
                  raise SystemExit("release verifier accepted an unversioned ZIP member")
          PY
      - name: Create CPA checksums
        working-directory: dist
        run: sha256sum ./*.zip | sed 's|  \./|  |' > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cpa-release
          path: dist/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/download-artifact@v4
        with:
          name: cpa-release
          path: dist
      - name: Publish verified CPA packages
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python ../scripts/release.py verify --dist . --tag "$GITHUB_REF_NAME"
          sha256sum --check checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "omp-billion-context $GITHUB_REF_NAME" \
            --notes "Self-contained plugin for CLIProxyAPI 8.1.4. See the repository README for installation and supported requests." \
            ./*.zip checksums.txt
